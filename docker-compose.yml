services:
  mongodb:
    image: mongo:7.0
    container_name: reallens-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: reallens_ai
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: reallens-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      DEBUG: "false"
      MODEL_WEIGHTS_DIR: /app/ml/checkpoints
      IMAGE_MODEL_PATH: /app/ml/checkpoints/image/best_model.pth
      VIDEO_MODEL_PATH: /app/ml/checkpoints/video/best_model.pth
      AUDIO_MODEL_PATH: /app/ml/checkpoints/audio/best_model.pth
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./ai-service:/app
      - ./ml:/app/ml
      - ./datasets:/app/datasets
      - reports-data:/app/reports
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 25s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: reallens-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/reallens_ai
      JWT_SECRET: ${JWT_SECRET:-reallens_ai_jwt_secret_key_change_in_production}
      AI_SERVICE_URL: http://ai-service:8000
      CLIENT_URL: http://localhost:5173
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      MAX_FILE_SIZE_BYTES: 104857600
    depends_on:
      mongodb:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    volumes:
      - ./server:/app
      - /app/node_modules
      - uploads-data:/app/uploads
      - reports-data:/app/reports
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: reallens-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:5000/api
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 25s

volumes:
  mongo-data:
  uploads-data:
  reports-data:
